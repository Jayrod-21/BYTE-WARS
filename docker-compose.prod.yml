# BYTE Wars — Production Docker Compose Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env vars (set via .env file or CI/CD):
#   JWT_SECRET, ENCRYPTION_KEY, POSTGRES_PASSWORD, ALLOWED_ORIGINS

services:
  backend:
    environment:
      - BYTE_WARS_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=postgresql+asyncpg://bytewars:${POSTGRES_PASSWORD}@postgres:5432/bytewars
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://bytewars.gg}
      - LOG_LEVEL=WARNING
    volumes: []  # No host mounts in production
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: always

  postgres:
    ports: []  # Don't expose DB port in production
    environment:
      POSTGRES_USER: bytewars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bytewars
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    ports: []  # Don't expose Redis port in production
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: always
